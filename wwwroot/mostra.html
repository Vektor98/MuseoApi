<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mostra — Museo Civico</title>
  <link rel="stylesheet" href="/css/stile.css">
</head>
<body>
  <header class="sito">
    <div class="barra">
      <a class="marchio" href="/index.html">Museo Civico <span>Pinacoteca e gabinetto dei disegni</span></a>
      <nav class="menu"></nav>
    </div>
  </header>

  <main>
    <p class="avviso" id="avviso"></p>

    <div id="intestazione"></div>

    <h2>Scegli un giorno</h2>
    <div class="con-calendario">
      <div>
        <div id="calendario"></div>
        <div class="legenda">
          <span class="l-liberi">posti liberi</span>
          <span class="l-esaurito">esaurito</span>
        </div>
      </div>
      <div>
        <p class="giorno-scelto" id="giornoScelto"></p>
        <div id="turni"></div>
      </div>
    </div>

    <h2>Opere esposte</h2>
    <div id="opere"></div>

    <h2>Giudizi dei visitatori</h2>
    <div id="feedback"></div>
  </main>

  <footer class="sito">
    <div>Prototipo realizzato per il project work in Informatica per le aziende digitali</div>
  </footer>

  <script src="/js/api.js"></script>
  <script type="module" src="/js/mostra.js"></script>
</body>
</html>
